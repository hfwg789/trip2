  <header class="site-header">

    <nav aria-label="主导航"><a href="#home">发现</a><a href="#explore">十大景点</a><a href="#favorites">收藏</a></nav>

  <main id="app">
    <section class="hero" aria-labelledby="hero-title">
      <img src="assets/china-journey-hero.png" alt="晨雾中的中国喀斯特山水与远山长城" fetchpriority="high">
      <div class="hero-overlay"></div>
      <div class="hero-copy">
        <p class="eyebrow">中国 · 十处值得出发的风景</p>
        <h1 id="hero-title">从一处风景，<br>读懂一方山河</h1>
        <p>路线、季节、交通与在地体验，出发前需要的信息都在这里。</p>
        <form class="search-shell" role="search">
